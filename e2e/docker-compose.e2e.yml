# Standalone services for the E2E harness (run from the host, NOT a devcontainer).
# Mirrors .devcontainer/docker-compose.yml but publishes ports on localhost so the
# api/workers/frontend processes running on the host can reach them.
name: monitool-e2e

services:
  mongo:
    image: mongo:5
    # Replica set is required: the app's mongod is started with --replSet, so it
    # refuses reads/writes until rs.initiate runs (see scripts/infra.mjs).
    command: --replSet rs0 --bind_ip_all
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis
    ports:
      - '6379:6379'

volumes:
  mongo_data:
